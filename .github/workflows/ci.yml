name: CI

# Runs for the default branch (main) and for PRs targeting it, plus a weekly run so
# the version policy (see the `versions` job) notices a new Expo SDK or npm major
# even when nothing is being pushed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# The event name is part of the group on purpose. Without it the Monday cron run on
# main shares a group with an in-flight push run and cancels it, and a cancelled CI
# run never fires the workflow_run trigger that publish.yml depends on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      # Deliberately no `cache: 'npm'`. That input makes setup-node run
      # `npm config get cache` using the npm *bundled with Node*, before the pinned npm
      # below is installed. Node 22 bundles npm 10.9.8, which is outside the supported
      # range, and devEngines rejects it (EBADDEVENGINES) on any npm command — so the
      # job died in this step. `npm install -g` does not trigger that check, which is
      # why the bootstrap itself is fine. Do not re-add the cache input.
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # npm 12 requires Node ^22.22.2 || ^24.15.0 || >=26.0.0, which is why Node 20 is
      # no longer in the matrix (it also went end-of-life on 2026-04-30). Keep this
      # version in step with the same pin in publish.yml; check-versions.mjs fails the
      # build if the two ever disagree.
      - name: Use npm 12
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      # The full suite runs on the lower Node version to keep CI fast.
      - name: Typecheck, lint, test, and build (Node 22)
        if: matrix.node-version == '22'
        run: npm run ci
        env:
          CI: true

      - name: Typecheck, lint, and build (Node 24)
        if: matrix.node-version != '22'
        run: npm run typecheck && npm run lint -- --max-warnings 0 && npm run build
        env:
          CI: true

  # Fails when a tracked Expo package or npm is declared outside its latest major (N)
  # or the one before it (N-1). This queries the registry, so it can go red on a day
  # nothing was pushed — that is the alarm working, not a flake.
  versions:
    name: Version policy (N / N-1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No `cache: 'npm'` — see the note in the check job above.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use npm 12
        run: npm install -g npm@12.0.2

      - run: npm ci

      - name: Check Expo and npm versions
        run: npm run check:versions

  security:
    name: Security (audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # No `cache: 'npm'` — see the note in the check job above.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use npm 12
        run: npm install -g npm@12.0.2

      - run: npm ci

      # Two tiers, because the blast radii are not comparable. Only @noble/* and
      # @scure/* reach consumers, and that set is small enough to hold to a strict
      # threshold. The dev tree carries the Expo toolchain, whose moderate advisories
      # recur and are frequently not resolvable from here.
      - name: Audit production dependencies (what consumers install)
        run: npm audit --omit=dev --audit-level=low

      - name: Audit the full dev tree
        run: npm audit --audit-level=high

      # Advisories say nothing about integrity: this is the check that would catch a
      # tampered or re-published tarball. It needs a real node_modules — with
      # --package-lock-only it reports "no dependencies to audit" — so it must stay
      # after npm ci.
      - name: Verify registry signatures and attestations
        run: npm audit signatures

      # The two example apps, audited straight from a lockfile with no install.
      #
      # `high` is the only workable threshold for them. Both carry the same 10 moderate
      # advisories, all tracing to one upstream uuid issue (GHSA-w5hq-g745-h8pq) reached
      # through xcode -> @expo/prebuild-config -> @expo/cli -> expo. npm's proposed fix
      # is expo@46.0.21, an eleven-major downgrade, so `moderate` would fail here every
      # run with no remedy available.
      - name: Audit demo/
        working-directory: demo
        run: npm audit --package-lock-only --audit-level=high

      # example/ deliberately commits no lockfile (the library is installed there with
      # --no-save), so one is synthesized purely to audit against. Consequence: this
      # step resolves fresh versions on every run and can therefore go red with no
      # commit, the same way the versions job can.
      - name: Audit example/
        working-directory: example
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --package-lock-only --audit-level=high

  pack:
    name: Verify npm pack (publish contents)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # No `cache: 'npm'` — see the note in the check job above.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use npm 12
        run: npm install -g npm@12.0.2

      - name: Install dependencies and build
        run: npm ci && npm run build

      # Guards package.json "files" and critical entries for published consumers.
      - name: Verify tarball includes dist, config, and docs
        run: |
          set -e
          npm pack --dry-run 2>&1 | tee pack-list.txt
          test -f pack-list.txt || (echo "npm pack --dry-run produced no output" && exit 1)
          grep -q 'dist/' pack-list.txt || (echo "Missing dist/" && exit 1)
          grep -q 'expo-module.config.json' pack-list.txt || (echo "Missing expo-module.config.json" && exit 1)
          grep -q 'README.md' pack-list.txt || (echo "Missing README.md" && exit 1)
          grep -q 'package.json' pack-list.txt || (echo "Missing package.json" && exit 1)
