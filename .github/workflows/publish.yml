name: Publish Package

on:
  # Manual release: a maintainer pushes a v* tag.
  push:
    tags: ['v*']
  # Gated release: CI succeeded on main. Waits for a human to approve the
  # "release" environment, then tags and publishes in one job.
  #
  # The tag cannot be pushed from CI and left to trigger the job above: tags
  # pushed with GITHUB_TOKEN do not start new workflow runs. Publishing also
  # has to stay in this file, because npm Trusted Publisher (OIDC) is bound to
  # the workflow filename. So the approved job does both.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    # Tag-push path only; the gated path is release-check -> release below.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Same approval gate as the automated path. github-actions[bot] cannot be
    # added to a ruleset bypass list, so restricting who may create v* tags
    # would break the automated release. Gating publication instead means a
    # v* tag on its own publishes nothing until a reviewer approves it.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce tag on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor ${{ github.sha }} origin/main || {
            echo "::error::Version tags (v*) must point to a commit on main. This tag was created from another branch."
            exit 1
          }

      # No registry-url on purpose. With it set, setup-node always writes
      # _authToken=${NODE_AUTH_TOKEN} into .npmrc; with no token supplied npm
      # uses that literal placeholder instead of performing the OIDC exchange,
      # and the registry answers E404. See actions/setup-node#1551. npm already
      # defaults to registry.npmjs.org.
      #
      # Node 24 because trusted publishing requires Node >= 22.14.0.
      #
      # No `cache: 'npm'` either: that input makes setup-node run `npm config get cache`
      # with the npm bundled in Node, before the pinned npm below is installed, and
      # devEngines rejects an out-of-range npm on any command (EBADDEVENGINES).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Keep in step with the same pin in ci.yml; check-versions.mjs fails the build
      # if the two files ever disagree. An older npm rejects a lockfile written by a
      # newer one as out of sync, so the version here is not incidental.
      - name: Use npm 12
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test, and build
        run: npm run ci
        env:
          CI: true

      - name: Publish to npm
        run: npm publish

  # Runs before the approval gate so that pushes which do not bump the version
  # never ask anyone to approve anything. An environment gate pauses a job
  # before its first step, so this check cannot live in the gated job.
  release-check:
    name: Check for an unreleased version
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout the commit CI just validated
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compare package.json version against existing tags
        id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already tagged. Nothing to release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at $version and v$version does not exist yet. Awaiting release approval."
          fi

  release:
    name: Release v${{ needs.release-check.outputs.version }}
    needs: release-check
    if: needs.release-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # The approval gate. Configure required reviewers on this environment;
    # the job waits here until someone approves it in the Actions UI.
    environment: release
    permissions:
      id-token: write # npm Trusted Publisher (OIDC)
      contents: write # pushing the version tag
    env:
      VERSION: ${{ needs.release-check.outputs.version }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the commit CI just validated
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Enforce commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$HEAD_SHA" origin/main || {
            echo "::error::$HEAD_SHA is not on main; refusing to release."
            exit 1
          }

      # No registry-url on purpose. With it set, setup-node always writes
      # _authToken=${NODE_AUTH_TOKEN} into .npmrc; with no token supplied npm
      # uses that literal placeholder instead of performing the OIDC exchange,
      # and the registry answers E404. See actions/setup-node#1551. npm already
      # defaults to registry.npmjs.org.
      #
      # Node 24 because trusted publishing requires Node >= 22.14.0.
      #
      # No `cache: 'npm'` either: that input makes setup-node run `npm config get cache`
      # with the npm bundled in Node, before the pinned npm below is installed, and
      # devEngines rejects an out-of-range npm on any command (EBADDEVENGINES).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Keep in step with the same pin in ci.yml; check-versions.mjs fails the build
      # if the two files ever disagree. An older npm rejects a lockfile written by a
      # newer one as out of sync, so the version here is not incidental.
      - name: Use npm 12
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      # CI already passed on this commit. Re-run here so the artifact being
      # published is built and verified in the same job that publishes it.
      - name: Typecheck, lint, test, and build
        run: npm run ci
        env:
          CI: true

      # Publish first. The tag is a record that a release happened, so it comes
      # after the irreversible step.
      #
      # Tagging first is what broke the 2.0.0 attempt: publish failed, the tag
      # survived, and every retry path was then blocked — release-check skips a
      # version that is already tagged, re-pushing an existing tag is a no-op,
      # and re-running the job died on "tag already exists". If publishing
      # succeeds and tagging fails, the fix is simply to push the tag by hand.
      # Trusted publishing failures surface as a misleading E404 or ENEEDAUTH
      # rather than a real diagnostic (npm/cli#9088), so print the claims npm
      # will present and compare them field by field against the Trusted
      # Publisher configuration on npmjs.com. Only claim names are printed,
      # never the token itself.
      - name: OIDC diagnostics
        run: |
          echo "node $(node --version), npm $(npm --version)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint in the environment; id-token: write is not in effect."
            exit 1
          fi
          echo "OIDC token endpoint: present"
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            | node -e '
              let d = "";
              process.stdin.on("data", (c) => (d += c)).on("end", () => {
                const payload = JSON.parse(d).value.split(".")[1];
                const claims = JSON.parse(Buffer.from(payload, "base64url").toString());
                for (const k of ["repository","repository_owner","workflow_ref","job_workflow_ref","environment","ref","event_name","aud"]) {
                  console.log("  " + k + ": " + (claims[k] ?? "(absent)"));
                }
              });
            '

      - name: Publish to npm
        run: npm publish --loglevel verbose

      - name: Tag the released commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::Tag v$VERSION already exists locally; reusing it."
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
          fi
          git push origin "v$VERSION"
